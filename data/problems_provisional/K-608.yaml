problem_statement: >-
  Literature pointer: nonlinear stability of the slowly rotating Kerr–de Sitter family as solutions of the vacuum
  Einstein equations with positive cosmological constant.
statement: >-
  Literature pointer: nonlinear stability of the slowly rotating Kerr–de Sitter family as solutions of the vacuum
  Einstein equations with positive cosmological constant.
why_it_matters: >-
  Important $\Lambda>0$ testbed where spectral gaps aid decay, and a clean example of a literature-solved stability
  problem that should not remain in the open-problem list.
scope:
  background: Four-dimensional Einstein vacuum equations with positive cosmological constant, $\operatorname{Ric}(g)-\Lambda g=0$.
  equation_type: "PDE level: full-einstein."
  linearity: Fully nonlinear Einstein evolution, with linearized stability as a proof input in Fang's route.
  regularity: >-
    Regularity and constraint hypotheses are those in the cited Hintz–Vasy and Fang theorems.
  parameter_regime: >-
    Slowly rotating Kerr–de Sitter parameters with $\Lambda>0$; this closure does not cover the full subextremal
    Kerr–de Sitter range.
  asymptotics: de sitter
  gauge_or_formulation: >-
    Gauge/final-parameter modulation as in the cited nonlinear stability theorems.
known_results:
  - statement: >-
      Hintz and Vasy establish full global nonlinear stability of the Kerr–de Sitter family for small angular momenta,
      without symmetry assumptions on the initial data.
    regime: Vacuum Einstein with $\Lambda>0$, slowly rotating Kerr–de Sitter.
    significance: Solves the statement as originally imported into this entry.
  - statement: >-
      Fang gives a later proof of nonlinear stability for slowly rotating Kerr–de Sitter using a bootstrap argument and
      lower regularity assumptions than the Nash-Moser route.
    regime: Vacuum Einstein with $\Lambda>0$, slowly rotating Kerr–de Sitter.
    significance: Independent confirmation/alternative proof route for the solved statement.
  - statement: >-
      Fang's linear stability theorem supplies the companion gauge-fixed linear theory used in the later nonlinear proof.
    regime: Linearized Einstein equations around slowly rotating Kerr–de Sitter.
    significance: Separates the nonlinear closure from related full-subextremal or interior problems.
remaining_gap: >-
  The slowly rotating Kerr–de Sitter statement is solved. Sharper open descendants should be split into new entries:
  full subextremal Kerr–de Sitter, lower regularity, explicit constants, or variant gauges/boundary formulations.
partial_progress: null
frontier_gap: null
solution_pointer:
  theorem_statement: >-
    Small perturbations of slowly rotating Kerr–de Sitter initial data for the Einstein vacuum equations with
    $\Lambda>0$ exist globally in the relevant exterior/cosmological region and converge exponentially, modulo gauge
    and final-parameter modulation, to a nearby Kerr–de Sitter metric.
  solved_by: Hintz and Vasy; alternative proof by Fang
  year: 2018
  citation_key: hintz-vasy-kds-nonlinear-stability
status_explanation: >-
  **Solved — literature closure submitted by abdulrahimiqbal.** K-608 asks for unconditional nonlinear stability of
  slowly rotating Kerr–de Sitter. This is exactly the slowly rotating $\Lambda>0$ stability theorem proved by
  Hintz–Vasy and later reproved by Fang. This is not a new proof claim; full-subextremal Kerr–de Sitter stability,
  conditional mode-stability programs, and Kerr–de Sitter interior/SCC problems remain separate open targets.
