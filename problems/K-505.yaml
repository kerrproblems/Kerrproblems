id: K-505
title: Threshold phenomena in separated Teukolsky-type ODEs on Kerr (zero modes, algebraically special limits, superradiant edges)
short_title: Kerr separated ODEs — threshold classification
cluster: spectral-scattering
theorem_status: partial
research_state: open_in_literature
problem_type: quantitative_sharpening
maturity: mostly_scoped
evidence_level: primary_refs_present
verification_state: verified_recently
priority: normal
summary: >-
  Classify threshold behavior (zero-frequency modes, algebraically special / repeated-root regimes,
  superradiant frequency boundaries) for separated radial/angular ODEs on Kerr with uniform $(M,a)$ control.
problem_statement: >-
  For the separated ODEs arising from Teukolsky or Regge–Wheeler–type reductions on Kerr, classify threshold
  resonant phenomena including (i) **zero-frequency** limits affecting low-energy resolvents, (ii)
  **algebraically special / repeated-root** regimes in the radial ODE, and (iii) edges of the **superradiant**
  frequency window—each with uniform bounds as parameters vary in compact subintervals of subextremality.
  The catalog should be checkable mode-by-mode and include uniformity statements in $(M,a)$.
statement: >-
  For the separated ODEs arising from Teukolsky or Regge–Wheeler–type reductions on Kerr, classify threshold
  resonant phenomena including (i) **zero-frequency** limits affecting low-energy resolvents, (ii)
  **algebraically special / repeated-root** regimes in the radial ODE, and (iii) edges of the **superradiant**
  frequency window—each with uniform bounds as parameters vary in compact subintervals of subextremality.
  The catalog should be checkable mode-by-mode and include uniformity statements in $(M,a)$.
why_it_matters: >-
  Threshold modes control low-frequency resolvent behavior and appear in stability and scattering
  constructions.
scope:
  background: Exact Kerr or agreed near-Kerr ODE coefficients after separation.
  equation_type: Coupled radial/angular ODEs from spin-weighted master equations.
  linearity: Linearized field equations on a fixed background.
  regularity: Analytic coefficients in the ODE domain away from singular points; Frobenius analysis at singularities.
  parameter_regime: >-
    Compact subsets of subextremal $(M,a)$ excluding extremality unless a separate limit is explicitly
    formulated.
  asymptotics: Asymptotically flat Kerr boundary conditions encoded in the ODEs.
  gauge_or_formulation: Teukolsky vs RW–Zerilli gauge choices recorded explicitly when comparing thresholds.
known_results:
  - statement: >-
      Separation of the Teukolsky master equation into radial and angular ODEs on Kerr (classical derivation).
    regime: Linearized perturbations of exact Kerr.
    significance: >-
      Foundational ODE setup; this entry targets **uniform threshold classification**, not the original
      separation itself.
  - statement: >-
      Real-axis mode stability for separated Teukolsky radial ODEs rules out nontrivial outgoing modes for
      admissible real frequencies, and gives quantitative Wronskian nonvanishing on compact real-frequency
      sets away from the expected zero-frequency and threshold exclusions.
    regime: Exact Kerr; Teukolsky spins; real nonzero frequencies.
    significance: >-
      Settles the nonzero real-frequency outgoing-mode obstruction and supplies much of the Wronskian control
      needed for the catalog away from threshold endpoints.
  - statement: >-
      Algebraically special frequencies are identified by vanishing of the radial Teukolsky-Starobinsky
      constant; the Teukolsky-Starobinsky identities show these are transform degeneracies rather than
      physical outgoing radial modes.
    regime: Exact Kerr radial Teukolsky ODEs.
    significance: >-
      Strongly supports the algebraically-special part of the K-505 catalog.
  - statement: >-
      Full-subextremal frequency-space estimates for spin ±1 and ±2 Teukolsky equations provide uniform
      separated-ODE estimates in the separation parameters, later upgraded to physical-space boundedness and
      decay.
    regime: Subextremal Kerr, spin ±1 and ±2 Teukolsky equations.
    significance: >-
      Supplies uniform frequency-space technology relevant to compact-subextremal threshold packaging, though
      it is not itself a mode-wise zero-frequency catalog.
  - statement: >-
      Low-energy Fredholm and resolvent analyses for Teukolsky equations give substantial control near
      zero frequency, including invertibility and mapping estimates in transformed frameworks.
    regime: Full subextremal Kerr, low-energy Teukolsky resolvent.
    significance: >-
      Provides serious evidence for the zero-frequency part, but still needs translation into the explicit
      separated-ODE Frobenius/connection catalog requested here.
remaining_gap: >-
  Prove or cite a single theorem giving the zero-frequency Frobenius/connection catalog for each spin and
  angular branch, identify all non-radiative stationary/gauge/charge exceptions, translate low-energy Fredholm
  resolvent results into separated-ODE language, compare Teukolsky and Regge-Wheeler-type normalizations, and
  package compact-subextremal $(M,a)$ uniformity across all threshold families.
status_explanation: >-
  **Partial / strong literature-supported reduction:** nonzero real-frequency mode stability and the
  algebraically-special Teukolsky-Starobinsky degeneracy are well supported by primary literature. The decisive
  missing piece is still the consolidated zero-frequency and normalization-dependent threshold catalog requested
  by this page.
math_required: >-
  ODE spectral theory; Frobenius methods; connection formulas; Teukolsky equations; asymptotic analysis of
  eigenvalue branches.
completion_criteria: >-
  Complete catalog with checkable mode-wise proofs and $(M,a)$ uniformity.
implications: >-
  Strengthens QNM and scattering foundations used across clusters.
