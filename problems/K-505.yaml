relevance: pure-math
fv_suitability: high
fv_reason: >-
  Separated radial/angular ODEs with polynomial coefficients; threshold behavior is finite-dimensional
  spectral-edge analysis.
progress_summary: >-
  Nonzero real-frequency mode stability and quantitative Wronskian nonvanishing for Teukolsky modes are
  established in the literature, and algebraically special frequencies are understood as Teukolsky-Starobinsky
  transform degeneracies rather than outgoing resonances. The remaining open packaging is a complete mode-wise
  threshold catalog, especially at zero frequency, including stationary/gauge exceptions and uniform
  compact-subextremal parameter dependence.
