summary: >-
  A plausible Kerr–Newman extremal-limit tail problem, held for bibliography repair: existing references support
  adjacent Aretakis, charged-field, and linear Kerr–Newman facts, not yet the full stated correspondence.
problem_statement: >-
  Relate leading-order late-time tails of coupled Maxwell or scalar fields on near-extremal Kerr–Newman backgrounds to
  conserved charges (electric/magnetic) and angular momentum in a quantitative theorem with explicit extremal limits.
statement: >-
  Relate leading-order late-time tails of coupled Maxwell or scalar fields on near-extremal Kerr–Newman backgrounds to
  conserved charges (electric/magnetic) and angular momentum in a quantitative theorem with explicit extremal limits.
why_it_matters: >-
  Extremal limits mix long-range electromagnetic and gravitational effects; tails encode observables in idealized
  models.
scope:
  background: Asymptotically flat four-dimensional general relativity unless the statement specifies otherwise.
  equation_type: "PDE level: einstein-maxwell, full-einstein."
  linearity: Primarily stationary or linearized reductions unless the statement says otherwise.
  regularity: Smooth / Sobolev classes as in the problem statement; tighten when citing a specific theorem.
  parameter_regime: >-
    Extremal or near-extremal Kerr-type parameters; quantify smallness of $|1-|a|/M|$ or surface gravity $κ$ in any
    claim.
  asymptotics: asymptotically-flat
  gauge_or_formulation: >-
    State gauge/fixing class compatible with cited stability or interior programs (e.g. generalized harmonic,
    double-null interior charts).
known_results:
  - statement: >-
      Aretakis instability and conserved charges on extremal horizons are established for scalar test fields; spin-2 and
      nonlinear extremal dynamics are much less complete.
    regime: Extremal horizons; often linear scalar.
    significance: Shows qualitative difference from subextremal decay.
  - statement: Subextremal nonlinear Kerr stability is known for small $|a|/M$; uniformity as $|a|\to M$ is not a corollary.
    regime: Nonlinear vacuum, restricted subextremal window.
    significance: Separates near-extremal uniformity from existing subextremal theorems.
  - statement: Near-horizon NHEK limits capture extremal mode structure but matching to global Kerr is an open PDE bridge.
    regime: Near-horizon scaling limits.
    significance: Clarifies what NHEK analyses do and do not imply globally.
remaining_gap: >-
  Theorems with explicit exponents and coefficients linking tail amplitudes to charge data, including convergence as
  extremality is approached.
status_explanation: >-
  **Needs reference repair:** the target is scientifically plausible, but this page should not advertise the
  charge–tail correspondence as a literature-grounded open theorem until maintainers pin primary references that
  directly support the Kerr–Newman tail/charge formulation. Current references support adjacent ingredients only.
math_required: >-
  Einstein–Maxwell perturbations; Aretakis-type blow-up mechanisms; matched asymptotics; Price-law heuristics vs.
  theorem-level decay rates.
completion_criteria: >-
  Theorems with explicit exponents and coefficients linking tail amplitudes to charge data, including convergence as
  extremality is approached.
implications: Unifies extremal decay phenomenology with conserved-charge algebra.
